<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>تقني عُمان | Tech Oman</title>
<meta name="description" content="منصة عُمانية لاكتشاف وطلب الخدمات التقنية والبرمجية والدعم الفني في سلطنة عُمان">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#f26a1b;--brand2:#ff9d3d;--brandRgb:242,106,27;--bg:#fff7f0;--card:#fff;--ink:#1f2430;--mute:#6b7280;--line:#f0e2d6;--chip:#fff;--ok:#0f9a4a;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120f;--card:#221b16;--ink:#f5eee8;--mute:#a89b90;--line:#3a2d24;--chip:#2a211b;--ok:#3ddc84}}
:root[data-theme="dark"]{--bg:#17120f;--card:#221b16;--ink:#f5eee8;--mute:#a89b90;--line:#3a2d24;--chip:#2a211b;--ok:#3ddc84}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
body{font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:30}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.wrap{max-width:1120px;margin:auto;padding:0 14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff}
.hd{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800}
.mk{width:36px;height:36px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:20px}
.act{display:flex;gap:8px}
.pill{padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.22);font-weight:700;font-size:14px}
.pill.solid{background:#fff;color:var(--brand)}
.hero{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;padding:8px 0 26px;border-radius:0 0 28px 28px}
.hero h1{font-size:clamp(22px,4.6vw,34px);font-weight:800;line-height:1.3}
.hero p{opacity:.92;margin:4px 0 14px;font-size:14px}
.sb{display:flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border-radius:18px;padding:6px 12px;box-shadow:0 8px 24px rgba(var(--brandRgb),.18)}
.sb input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 4px;font-size:16px}
.cam{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--brand);color:var(--brand);font-weight:700;font-size:14px;white-space:nowrap}
.go{padding:10px 18px;border-radius:12px;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;font-weight:700}
.hs{display:none}
@media(min-width:640px){.hs{display:inline}}
.lbl{margin:18px 0 8px;font-weight:800;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:99px;background:var(--chip);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:760px){.cats{grid-template-columns:repeat(9,1fr)}}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;font-size:13px;font-weight:700;text-align:center}
.cat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(var(--brandRgb),.14)}
.cat.on{border-color:var(--brand);color:var(--brand)}
.top{display:flex;justify-content:space-between;align-items:baseline}
.mute{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:96px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.ad{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ph{aspect-ratio:4/3;display:grid;place-items:center;font-size:54px;position:relative;background:linear-gradient(135deg,hsl(var(--h) 90% 91%),hsl(var(--h) 80% 78%))}
.fv{position:absolute;top:8px;inset-inline-end:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);font-size:16px}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
.ad .b{padding:10px 12px 12px}
.pr{color:var(--brand);font-weight:800;font-size:17px}
.tt{font-weight:700;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.mt{color:var(--mute);font-size:12px;display:flex;justify-content:space-between;gap:6px;margin-top:4px}
.empty{grid-column:1/-1;text-align:center;padding:40px 0;color:var(--mute)}
footer{text-align:center;color:var(--mute);font-size:12px;padding:10px 0 24px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:18px}
.dz{display:block;border:2px dashed var(--brand);border-radius:18px;padding:24px 12px;text-align:center;background:rgba(var(--brandRgb),.07);cursor:pointer}
.dz .big{font-size:38px}
.ld{display:flex;gap:12px;align-items:center;margin-top:14px}
.pv{width:84px;height:84px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:6%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .5s}
.ok{color:var(--ok);font-weight:700;font-size:13px}
.st{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-top:8px}
.st.best{border-color:var(--ok);background:rgba(15,154,74,.09)}
.lg{width:38px;height:38px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
.pt{text-align:end}
.btn{width:100%;margin-top:14px;padding:12px;border-radius:14px;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;font-weight:700}
.demo{margin-top:10px;font-size:12px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#222;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i{transition:none}}
[hidden]{display:none!important}
.shot{display:flex;align-items:center;gap:12px;width:100%;background:#fff;color:var(--brand);border-radius:20px;padding:14px 16px;margin-bottom:10px;text-align:start;box-shadow:0 8px 24px rgba(var(--brandRgb),.18)}
.shot>span{font-size:34px}.shot b{display:block;font-size:18px}.shot small{display:block;color:#6b7280;font-size:13px}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;font-size:30px;box-shadow:0 8px 22px rgba(var(--brandRgb),.5);z-index:15}
#cv{position:relative;border-radius:18px;overflow:hidden;background:#000}
#vd{width:100%;max-height:60vh;display:block;object-fit:cover}
.snap{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:66px;height:66px;border-radius:50%;background:#fff;border:5px solid var(--brand)}
.row{display:flex;gap:8px;margin:12px 0 6px}
.row .btn{margin-top:0;flex:1;width:auto;display:block;text-align:center;cursor:pointer}
.btn.alt{background:var(--card);color:var(--brand);border:1.5px solid var(--brand)}
a.chip{text-decoration:none;color:inherit}
.im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lk a{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(var(--brandRgb),.12);color:var(--brand);text-decoration:none}
.fm{display:grid;gap:10px}
.fm input,.fm select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.dz.sm{padding:14px}
.shops{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
@media(min-width:640px){.shops{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.shops{grid-template-columns:repeat(3,1fr)}}
.shop{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;font-size:26px;flex:none}
.si{min-width:0}.tg{flex-wrap:wrap;overflow:visible;margin-top:6px}.tg .chip{padding:2px 10px;font-size:12px}
a.btn{display:block;text-align:center;text-decoration:none}
@media(max-width:420px){.pill{padding:6px 10px;font-size:13px}.logo{font-size:18px}.act{gap:6px}}
.st.rq{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.sc b{font-size:18px;display:block}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.pl{margin-top:8px;font-size:13px}.pl summary{cursor:pointer;color:var(--brand);font-weight:700}
.pi{display:flex;gap:8px;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}.pi span{flex:1;min-width:0}.pi a{color:var(--brand);text-decoration:none}
.av{position:relative;overflow:hidden}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.dock{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:99px;background:var(--card);border:1.5px solid var(--brand);box-shadow:0 8px 24px rgba(var(--brandRgb),.35);z-index:15;max-width:calc(100% - 24px)}
.dk-cam{width:56px;height:56px;border-radius:50%;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;font-size:28px;flex:none;box-shadow:0 4px 14px rgba(var(--brandRgb),.5)}
.dk-btn{padding:0 16px;height:44px;color:var(--brand);font-weight:800;font-size:15px;white-space:nowrap}
.gear-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.42);box-shadow:0 4px 14px rgba(0,0,0,.12);backdrop-filter:blur(8px);transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
.gear-btn:hover{background:rgba(255,255,255,.3);box-shadow:0 6px 18px rgba(0,0,0,.16)}
.gear-btn:active{transform:scale(.94)}
.gear-btn svg{width:23px;height:23px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.14))}
.settings-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:45}
.settings-backdrop.on{display:block}
.settings-panel{position:absolute;top:0;right:0;width:min(88vw,340px);height:100%;overflow:auto;background:var(--card);color:var(--ink);padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:-12px 0 36px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .22s ease}
.settings-backdrop.on .settings-panel{transform:translateX(0)}
.menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:19px}
.menu-close{width:34px;height:34px;border-radius:10px;background:var(--bg);font-size:18px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;margin:8px 0;border:1px solid var(--line);border-radius:13px;background:var(--bg);text-align:start;font-weight:700;font-size:16px}
.menu-item>span:first-child{width:28px;text-align:center;font-size:19px}
.theme-picker{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.theme-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.theme-title b{font-size:16px}.theme-title small{font-size:11px;color:var(--mute)}
.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.theme-swatch{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:11px 5px;border:1px solid var(--line);border-radius:13px;background:var(--bg);font-size:12px;font-weight:700;transition:border-color .18s,background .18s,transform .18s}
.theme-swatch:hover{transform:translateY(-2px)}
.theme-swatch.selected{border:2px solid var(--brand);background:rgba(var(--brandRgb),.08);padding:10px 4px}
.theme-dot{display:block;width:25px;height:25px;border-radius:50%;background:var(--swatch);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 2px 5px rgba(0,0,0,.12)}
.theme-reset{width:100%;margin-top:11px;padding:10px 12px;border-radius:11px;border:1px dashed var(--line);color:var(--mute);font-weight:700;background:var(--card)}
.theme-reset.selected{border-color:var(--brand);color:var(--brand);background:rgba(var(--brandRgb),.08)}
</style>
</head>
<body>
<header id="sitehd"><div class="wrap hd">
 <div class="logo"><span class="mk">🛍️</span><span data-i="brand"></span></div>
 <div class="act"><button class="gear-btn" id="gearBtn" type="button" aria-label="الإعدادات" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-1.99 1.82l-.07.76a2 2 0 0 1-1 1.7 2 2 0 0 1-1.99.03l-.66-.39a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.65.39a2 2 0 0 1 1 1.72v.06a2 2 0 0 1-1 1.72l-.65.39a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.66-.39a2 2 0 0 1 1.99.03 2 2 0 0 1 1 1.7l.07.76A2 2 0 0 0 11.78 22h.44a2 2 0 0 0 1.99-1.82l.07-.76a2 2 0 0 1 1-1.7 2 2 0 0 1 1.99-.03l.66.39a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.65-.39a2 2 0 0 1-1-1.72v-.06a2 2 0 0 1 1-1.72l.65-.39a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.66.39a2 2 0 0 1-1.99-.03 2 2 0 0 1-1-1.7l-.07-.76A2 2 0 0 0 12.22 2z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
</div></header>
<div class="settings-backdrop" id="settingsBackdrop" aria-hidden="true">
 <aside class="settings-panel" id="settingsPanel" role="dialog" aria-modal="true" aria-label="إعدادات الموقع">
  <div class="menu-head"><b id="menuTitle">الإعدادات</b><button class="menu-close" id="menuClose" type="button" aria-label="إغلاق">✕</button></div>
  <button class="menu-item" id="post" type="button"><span aria-hidden="true">📢</span><span data-i="post"></span></button>
  <button class="menu-item" id="lb" type="button"><span aria-hidden="true">🌐</span><span data-i="lang"></span></button>
  <button class="menu-item" id="lgn" type="button" hidden><span aria-hidden="true">🔐</span><span id="lgnLabel" data-i="signin"></span></button>
  <button class="menu-item" id="rbtn" type="button"><span aria-hidden="true">🏪</span><span data-i="rbtn"></span></button>
  <section class="theme-picker" aria-label="Store themes"><div class="theme-title"><b id="themeTitle">ثيمات المتجر</b><small id="themeHint">اختر لونك المفضل</small></div><div class="theme-grid">
   <button class="theme-swatch" type="button" data-theme-choice="blue" aria-pressed="false" style="--swatch:#2563eb"><i class="theme-dot"></i><span data-theme-name data-ar="أزرق محيطي" data-en="Ocean blue">أزرق محيطي</span></button>
   <button class="theme-swatch" type="button" data-theme-choice="green" aria-pressed="false" style="--swatch:#059669"><i class="theme-dot"></i><span data-theme-name data-ar="أخضر زمردي" data-en="Emerald">أخضر زمردي</span></button>
   <button class="theme-swatch" type="button" data-theme-choice="purple" aria-pressed="false" style="--swatch:#7c3aed"><i class="theme-dot"></i><span data-theme-name data-ar="بنفسجي ملكي" data-en="Royal purple">بنفسجي ملكي</span></button>
   <button class="theme-swatch" type="button" data-theme-choice="rose" aria-pressed="false" style="--swatch:#e11d48"><i class="theme-dot"></i><span data-theme-name data-ar="أحمر وردي" data-en="Ruby rose">أحمر وردي</span></button>
   <button class="theme-swatch" type="button" data-theme-choice="teal" aria-pressed="false" style="--swatch:#0f9f9a"><i class="theme-dot"></i><span data-theme-name data-ar="فيروزي" data-en="Turquoise">فيروزي</span></button>
   <button class="theme-swatch" type="button" data-theme-choice="gold" aria-pressed="false" style="--swatch:#b7791f"><i class="theme-dot"></i><span data-theme-name data-ar="ذهبي" data-en="Golden">ذهبي</span></button>
  </div><button class="theme-reset" id="themeReset" type="button" aria-pressed="true">↺ استعادة اللون الأساسي</button></section>
 </aside>
</div>

<section class="hero"><div class="wrap">
 <h1 data-i="h1"></h1><p data-i="sub"></p>
 <button class="shot" id="shot"><span aria-hidden="true">📷</span><div><b data-i="shot"></b><small data-i="shot2"></small></div></button>
 <div class="sb"><span aria-hidden="true">🔍</span>
  <input id="q" type="search" enterkeyhint="search" autocomplete="off">
  <button class="cam" id="cam"><span>📷</span><b class="hs" data-i="cam"></b></button>
  <button class="go" id="go" data-i="go"></button>
 </div>
</div></section>

<main class="wrap">
 <p class="lbl" id="citylbl">📍 <span data-i="city"></span></p>
 <div class="chips" id="cities"></div>
 <p class="lbl" id="catlbl" data-i="cats"></p>
 <div class="cats" id="cats"></div>
 <section id="shopsec"><p class="lbl">📸 <span data-i="shops"></span></p><div class="chips" id="stags"></div><div class="shops" id="shops"></div><p class="mute demo" data-i="shops_n"></p></section>
 <div class="top lbl" id="latest"><span data-i="latest"></span><span class="mute" id="count"></span></div>
 <div class="grid" id="grid"></div>
</main>
<footer data-i="foot"></footer>

<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true">
 <div class="sh"><b data-i="m_title"></b><button id="x" aria-label="Close">✕</button></div>
 <div id="cv" hidden><video id="vd" autoplay playsinline muted></video><button class="snap" id="snap" aria-label="Capture"></button></div>
 <div class="dz" id="dz"><div class="big">📷</div>
  <div class="row"><label class="btn"><input type="file" id="f2" accept="image/*" capture="environment" hidden><span data-i="m_cam2"></span></label><label class="btn alt"><input type="file" id="f" accept="image/*" hidden><span data-i="m_gal"></span></label></div>
  <small class="mute" data-i="m_hint"></small><br><button class="chip" id="live" data-i="m_live2"></button></div>
 <div id="res"></div>
</div></div>
<div class="dock"><button class="dk-cam" id="fab" aria-label="Camera">📷</button></div>
<div class="ov" id="ov2"><div class="sheet" role="dialog" aria-modal="true">
 <div class="sh"><b data-i="pt"></b><button id="x2" aria-label="Close">✕</button></div>
 <div class="chips" id="kind"></div>
 <div class="fm">
  <label class="dz sm"><input type="file" id="pf" accept="image/*" hidden><span id="pfl" data-i="pimg"></span></label>
  <input id="pti" data-ph="ptitle" maxlength="80">

function initG(){if(!GCID||!window.google||!google.accounts)return;google.accounts.id.initialize({client_id:GCID,callback:async r=>{try{const j=await api("/api/auth/google",{method:"POST",body:JSON.stringify({credential:r.credential})});GT=j.token;GU=j.user;try{localStorage.setItem("gtok",GT);localStorage.setItem("guser",JSON.stringify(GU))}catch(e){}await loadMine();drawAcc();drawAds();toast(t("signedin"))}catch(e){toast(t("rfail"))}}});drawAcc()}
function loadG(){if(!GCID)return;if(window.google&&google.accounts)return initG();if($("gsi"))return;const s=document.createElement("script");s.id="gsi";s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=initG;document.head.appendChild(s)}
async function loadMine(){MYIDS=new Set();MYADS=[];if(!GT)return;try{const r=await api("/api/me/ads");MYADS=r.items;r.items.forEach(x=>MYIDS.add(x.id))}catch(e){signOut(1)}}
function signOut(q){GT="";GU=null;MYIDS=new Set();MYADS=[];try{localStorage.removeItem("gtok");localStorage.removeItem("guser")}catch(e){}try{if(window.google&&google.accounts)google.accounts.id.disableAutoSelect()}catch(e){}if(!q){drawAcc();drawAds()}}
function needLogin(){if(REQLOGIN&&!GT){openAcc();toast(t("needlogin"));return true}return false}
function openAcc(){drawAcc();$("ov6").classList.add("on")}
function drawAcc(){
 const label=$("lgnLabel");if(label)label.textContent=GU?((GU.name||"").split(" ")[0]||t("account")):t("signin");
 $("acc").innerHTML=GT?`<div class="ld"><img class="pv" style="width:56px;height:56px;border-radius:50%" src="${esc(GU&&GU.pic||"")}" alt="" onerror="this.remove()"><div><b>${esc(GU&&GU.name||"")}</b></div></div><h4 class="lbl">${t("myads")}</h4>${MYADS.length?MYADS.map(a=>`<div class="st"><div style="flex:1;min-width:0"><b>${esc(a.t)}</b><br><small class="mute">${esc(T[L]["s_"+a.status]||a.status)} · ${fmt(+a.p||0)}</small></div><button class="chip" data-mydel="${esc(a.id)}">🗑️</button></div>`).join(""):`<p class="mute">${t("noads")}</p>`}<button class="btn alt" id="gout" style="margin-top:12px">${t("signout")}</button>`:`<p class="mute" style="margin:10px 0">${t("signmsg")}</p>${GCID?'<div id="gbtn" style="display:flex;justify-content:center"></div>':'<p class="mute">${L=="ar"?"تسجيل الدخول بجوجل غير مفعّل حالياً. يلزم إعداد GOOGLE_CLIENT_ID في Render.":"Google sign-in is not configured yet. Set GOOGLE_CLIENT_ID in Render."}</p>'}`;
 if(!GT&&GCID&&window.google&&google.accounts&&$("gbtn"))google.accounts.id.renderButton($("gbtn"),{theme:"outline",size:"large",width:260,locale:L=="ar"?"ar":"en"});
}
$("lgn").onclick=()=>{closeSettingsMenu();openAcc()};
$("x6").onclick=()=>$("ov6").classList.remove("on");
$("ov6").onclick=e=>{if(e.target==$("ov6"))$("ov6").classList.remove("on")};
$("acc").onclick=e=>{if(e.target.closest("#gout")){signOut();$("ov6").classList.remove("on");return}const d=e.target.closest("[data-mydel]");if(d)delMine(d.dataset.mydel)};
lang();loadData();loadSettings();
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>سوق عُمان | Souq Oman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#f26a1b;--brand2:#ff9d3d;--bg:#fff7f0;--card:#fff;--ink:#1f2430;--mute:#6b7280;--line:#f0e2d6;--chip:#fff;--ok:#0f9a4a;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120f;--card:#221b16;--ink:#f5eee8;--mute:#a89b90;--line:#3a2d24;--chip:#2a211b;--ok:#3ddc84}}
:root[data-theme="dark"]{--bg:#17120f;--card:#221b16;--ink:#f5eee8;--mute:#a89b90;--line:#3a2d24;--chip:#2a211b;--ok:#3ddc84}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
body{font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:30}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.wrap{max-width:1120px;margin:auto;padding:0 14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(120deg,#f26a1b,#ff9d3d);color:#fff}
.hd{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800}
.mk{width:36px;height:36px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:20px}
.act{display:flex;gap:8px}
.pill{padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.22);font-weight:700;font-size:14px}
.pill.solid{background:#fff;color:#d9540c}
.hero{background:linear-gradient(120deg,#f26a1b,#ff9d3d);color:#fff;padding:8px 0 26px;border-radius:0 0 28px 28px}
.hero h1{font-size:clamp(22px,4.6vw,34px);font-weight:800;line-height:1.3}
.hero p{opacity:.92;margin:4px 0 14px;font-size:14px}
.sb{display:flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border-radius:18px;padding:6px 12px;box-shadow:0 8px 24px rgba(120,50,0,.22)}
.sb input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:10px 4px;font-size:16px}
.cam{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--brand);color:var(--brand);font-weight:700;font-size:14px;white-space:nowrap}
.go{padding:10px 18px;border-radius:12px;background:linear-gradient(120deg,#f26a1b,#ff9d3d);color:#fff;font-weight:700}
.hs{display:none}
@media(min-width:640px){.hs{display:inline}}
.lbl{margin:18px 0 8px;font-weight:800;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:99px;background:var(--chip);border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:760px){.cats{grid-template-columns:repeat(9,1fr)}}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;font-size:13px;font-weight:700;text-align:center}
.cat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:rgba(242,106,27,.14)}
.cat.on{border-color:var(--brand);color:var(--brand)}
.top{display:flex;justify-content:space-between;align-items:baseline}
.mute{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:96px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.ad{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ph{aspect-ratio:4/3;display:grid;place-items:center;font-size:54px;position:relative;background:linear-gradient(135deg,hsl(var(--h) 90% 91%),hsl(var(--h) 80% 78%))}
.fv{position:absolute;top:8px;inset-inline-end:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);font-size:16px}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px}
.ad .b{padding:10px 12px 12px}
.pr{color:var(--brand);font-weight:800;font-size:17px}
.tt{font-weight:700;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.mt{color:var(--mute);font-size:12px;display:flex;justify-content:space-between;gap:6px;margin-top:4px}
.empty{grid-column:1/-1;text-align:center;padding:40px 0;color:var(--mute)}
footer{text-align:center;color:var(--mute);font-size:12px;padding:10px 0 24px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:22px}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:18px}
.dz{display:block;border:2px dashed var(--brand);border-radius:18px;padding:24px 12px;text-align:center;background:rgba(242,106,27,.07);cursor:pointer}
.dz .big{font-size:38px}
.ld{display:flex;gap:12px;align-items:center;margin-top:14px}
.pv{width:84px;height:84px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:6%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .5s}
.ok{color:var(--ok);font-weight:700;font-size:13px}
.st{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-top:8px}
.st.best{border-color:var(--ok);background:rgba(15,154,74,.09)}
.lg{width:38px;height:38px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
.pt{text-align:end}
.btn{width:100%;margin-top:14px;padding:12px;border-radius:14px;background:linear-gradient(120deg,#f26a1b,#ff9d3d);color:#fff;font-weight:700}
.demo{margin-top:10px;font-size:12px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#222;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i{transition:none}}
[hidden]{display:none!important}
.shot{display:flex;align-items:center;gap:12px;width:100%;background:#fff;color:#d9540c;border-radius:20px;padding:14px 16px;margin-bottom:10px;text-align:start;box-shadow:0 8px 24px rgba(120,50,0,.22)}
.shot>span{font-size:34px}.shot b{display:block;font-size:18px}.shot small{display:block;color:#6b7280;font-size:13px}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:64px;height:64px;border-radius:50%;background:linear-gradient(120deg,#f26a1b,#ff9d3d);color:#fff;font-size:30px;box-shadow:0 8px 22px rgba(242,106,27,.5);z-index:15}
#cv{position:relative;border-radius:18px;overflow:hidden;background:#000}
#vd{width:100%;max-height:60vh;display:block;object-fit:cover}
.snap{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:66px;height:66px;border-radius:50%;background:#fff;border:5px solid var(--brand)}
.row{display:flex;gap:8px;margin:12px 0 6px}
.row .btn{margin-top:0;flex:1;width:auto;display:block;text-align:center;cursor:pointer}
.btn.alt{background:var(--card);color:var(--brand);border:1.5px solid var(--brand)}
a.chip{text-decoration:none;color:inherit}
.im{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lk{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lk a{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(242,106,27,.12);color:var(--brand);text-decoration:none}
.fm{display:grid;gap:10px}
.fm input,.fm select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.dz.sm{padding:14px}
.shops{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
@media(min-width:640px){.shops{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.shops{grid-template-columns:repeat(3,1fr)}}
.shop{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#f26a1b,#ff9d3d);display:grid;place-items:center;font-size:26px;flex:none}
.si{min-width:0}.tg{flex-wrap:wrap;overflow:visible;margin-top:6px}.tg .chip{padding:2px 10px;font-size:12px}
a.btn{display:block;text-align:center;text-decoration:none}
@media(max-width:420px){.pill{padding:6px 10px;font-size:13px}.logo{font-size:18px}.act{gap:6px}}
.st.rq{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.sc b{font-size:18px;display:block}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header id="sitehd"><div class="wrap hd">
 <div class="logo"><span class="mk">🛍️</span><span data-i="brand"></span></div>
 <div class="act"><button class="pill" id="lb" data-i="lang"></button><button class="pill solid" id="post" data-i="post"></button></div>
</div></header>

<section class="hero"><div class="wrap">
 <h1 data-i="h1"></h1><p data-i="sub"></p>
 <button class="shot" id="shot"><span aria-hidden="true">📷</span><div><b data-i="shot"></b><small data-i="shot2"></small></div></button>
 <div class="sb"><span aria-hidden="true">🔍</span>
  <input id="q" type="search" enterkeyhint="search" autocomplete="off">
  <button class="cam" id="cam"><span>📷</span><b class="hs" data-i="cam"></b></button>
  <button class="go" id="go" data-i="go"></button>
 </div>
</div></section>

<main class="wrap">
 <p class="lbl">📍 <span data-i="city"></span></p>
 <div class="chips" id="cities"></div>
 <p class="lbl" data-i="cats"></p>
 <div class="cats" id="cats"></div>
 <section id="shopsec" hidden><p class="lbl">📸 <span data-i="shops"></span></p><div class="chips" id="stags"></div><div class="shops" id="shops"></div><button class="btn alt" id="rbtn" data-i="rbtn"></button><a class="btn" id="igs" target="_blank" rel="noopener noreferrer"></a><p class="mute demo" data-i="shops_n"></p></section>
 <div class="top lbl" id="latest"><span data-i="latest"></span><span class="mute" id="count"></span></div>
 <div class="grid" id="grid"></div>
</main>
<footer data-i="foot"></footer>

<div class="ov" id="ov"><div class="sheet" role="dialog" aria-modal="true">
 <div class="sh"><b data-i="m_title"></b><button id="x" aria-label="Close">✕</button></div>
 <div id="cv" hidden><video id="vd" autoplay playsinline muted></video><button class="snap" id="snap" aria-label="Capture"></button></div>
 <div class="dz" id="dz"><div class="big">📷</div>
  <div class="row"><label class="btn"><input type="file" id="f2" accept="image/*" capture="environment" hidden><span data-i="m_cam2"></span></label><label class="btn alt"><input type="file" id="f" accept="image/*" hidden><span data-i="m_gal"></span></label></div>
  <small class="mute" data-i="m_hint"></small><br><button class="chip" id="live" data-i="m_live2"></button></div>
 <div id="res"></div>
</div></div>
<button class="fab" id="fab" aria-label="Camera">📷</button>
<div class="ov" id="ov2"><div class="sheet" role="dialog" aria-modal="true">
 <div class="sh"><b data-i="pt"></b><button id="x2" aria-label="Close">✕</button></div>
 <div class="chips" id="kind"></div>
 <div class="fm">
  <label class="dz sm"><input type="file" id="pf" accept="image/*" hidden><span id="pfl" data-i="pimg"></span></label>
  <input id="pti" data-ph="ptitle" maxlength="80">
  <select id="pc"></select><select id="pct"></select>
  <input id="pp" type="number" inputmode="decimal" min="0" step="0.001" data-ph="pprice">
  <input id="pig" data-ph="pig" maxlength="80"><input id="pw" data-ph="pweb" inputmode="url" maxlength="200"><input id="pwa" data-ph="pwa" inputmode="tel" maxlength="16">
  <button class="btn" id="pub" data-i="pub"></button>
  <p class="mute demo" id="pnote"></p>
 </div></div></div>
<div class="ov" id="ov3"><div class="sheet" role="dialog" aria-modal="true">
 <div class="sh"><b data-i="rt_t"></b><button id="x3" aria-label="Close">✕</button></div>
 <div class="fm">
  <input id="rn" data-ph="rn" maxlength="60"><input id="rig" data-ph="pig" maxlength="80">
  <select id="rc"></select><input id="rt" data-ph="rt" maxlength="150">
  <input id="rw" data-ph="pweb" inputmode="url" maxlength="200"><input id="rwa" data-ph="pwa" inputmode="tel" maxlength="16">
  <button class="btn" id="rsub" data-i="rsub"></button><p class="mute demo" data-i="rnote"></p>
 </div></div></div>

<div class="toast" id="toast" role="status"></div>

function pick(f){

 if(!/^image\//.test(f.type)){toast(t("bad"));return}
 const r=new FileReader();
 r.onload=()=>analyze(r.result,f.name+f.size);
 r.readAsDataURL(f);$("f").value="";
}

}
function showRes(k){

 $("res").innerHTML=`<div class="ld"><img class="pv" src="${S.img}" alt=""><div><small class="mute">${t("found")}</small><h3>${p[0]} ${nm(p,1)}</h3>${auto?`<span class="ok">✓ ${t("conf")} ${S.conf}%</span>`:""}</div></div>

let stm;
const TAGS=["iphone15","smarttv","laptop","ps5","runningshoes","airfryer","wirelessheadphones","smartwatch"];
const openCam=()=>{$("ov").classList.add("on");$("res").innerHTML="";$("f2").click()};
async function startCam(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return false;
 try{stm=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});$("vd").srcObject=stm;$("cv").hidden=false;$("dz").hidden=true;return true}
 catch(e){toast(t("cam_err"));return false}
}
function stopCam(){if(stm)stm.getTracks().forEach(x=>x.stop());stm=null;$("cv").hidden=true}
["shot","fab","cam"].forEach(i=>$(i).onclick=openCam);
$("live").onclick=()=>startCam().then(ok=>{if(!ok)$("f2").click()});
$("snap").onclick=()=>{
 const v=$("vd");if(!v.videoWidth)return;
 const k=Math.min(1,800/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement("canvas");
 c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext("2d").drawImage(v,0,0,c.width,c.height);
 const u=c.toDataURL("image/jpeg",.8);analyze(u,u.length+u.slice(-200));
};
function analyze(img,seed){
 stopCam();$("dz").hidden=false;S.img=img;S.k=null;
 let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;
 S.h=h;S.conf=88+h%9;loading(()=>showRes(h%PROD.length));
}

 return `<h4 class="lbl">${t("rl_t")}</h4><div class="chips">${a("https://www.google.com/search?tbm=shop&q="+q,"🛒 "+t("rl_g"))}${a("https://www.google.com/maps/search/"+q,"🗺️ "+t("rl_m"))}${a("https://www.instagram.com/explore/tags/"+TAGS[k]+"/","📸 "+t("rl_i"))}</div><p class="mute demo">${t("rl_n")}</p>`;
}

$("x2").onclick=()=>$("ov2").classList.remove("on");
$("ov2").onclick=e=>{if(e.target==$("ov2"))$("ov2").classList.remove("on")};
$("pf").onchange=e=>{
 const f=e.target.files[0];if(!f||!/^image\//.test(f.type))return;
 const r=new FileReader();
 r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);PS.img=c.toDataURL("image/jpeg",.6);$("pfl").textContent=t("pimg_ok")};i.src=r.result};
 r.readAsDataURL(f);
};
$("pub").onclick=async()=>{
 const ti=$("pti").value.trim(),p=parseFloat($("pp").value);
 const ig=$("pig").value.trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i,"").replace(/^@/,"").replace(/[\/?].*$/,"");
 let wb=$("pw").value.trim();if(wb&&!/^https?:\/\//i.test(wb))wb="https://"+wb;
 let wa=$("pwa").value.replace(/\D/g,"");if(wa.length==8)wa="968"+wa;
 const a={type:"ad",cat:$("pc").value,city:$("pct").value,t:ti,p,img:PS.img,ig:igOk(ig),web:webOk(wb),wa:waOk(wa),store:PS.store};
 if(ti.length<3||!(p>=0)){toast(t("perr1"));return}
 if(!a.ig&&!a.web&&!a.wa){toast(t("perr2"));return}
 try{await api("/api/requests",{method:"POST",body:JSON.stringify(a)})}catch(e){toast(t("rfail"));return}
 ["pti","pp","pig","pw","pwa"].forEach(i=>$(i).value="");PS.img="";$("pfl").textContent=t("pimg");
 $("ov2").classList.remove("on");toast(t("pdone1"));
};

function drawShops(){
 const q=$("q").value.trim().toLowerCase(),base=[...SHOPS,...SHOPS_DB].filter(s=>!S.cat||!s.cat||s.cat==S.cat);
 const tags=[...new Map(base.flatMap(s=>s.tags).map(x=>[x[1],x])).values()];
 if(S.tag&&!tags.some(x=>x[1]==S.tag))S.tag="";
 const l=base.filter(s=>(!S.tag||s.tags.some(x=>x[1]==S.tag))&&(!q||(s.n+" "+s.tags.join(" ")).toLowerCase().includes(q)));
 const tg=x=>`<button class="chip${S.tag==x[1]?" on":""}" data-tg="${esc(x[1])}">${esc(nm(x,0))}</button>`,o=' target="_blank" rel="noopener noreferrer"';
 $("shopsec").hidden=false;
 const ct=CATS.find(c=>c[0]==S.cat),cy=CITIES.find(c=>c[0]==S.city),g=$("igs");
 g.textContent=t("igs");g.href="https://www.google.com/search?q="+encodeURIComponent("site:instagram.com "+(ct?nm(ct,2):(L=="ar"?"متجر":"store"))+" "+(cy?nm(cy,1):(L=="ar"?"عمان":"Oman")));
 $("stags").innerHTML=tags.map(tg).join("");
 $("shops").innerHTML=!l.length?`<p class="mute">${t("noshop")}</p>`:l.map(s=>{const ig=igOk(s.ig),wb=webOk(s.web),wa=waOk(s.wa);
  return `<div class="shop"><div class="av">${esc(s.e)}</div><div class="si"><b>${esc(s.n)}</b> <small class="mute">@${esc(ig)}</small><div class="chips tg">${s.tags.map(tg).join("")}</div><div class="lk">${ig?`<a href="https://www.instagram.com/${ig}/"${o}>📸 Instagram</a>`:""}${wb?`<a href="${esc(wb)}"${o}>🌐 ${t("web")}</a>`:""}${wa?`<a href="https://wa.me/${wa}"${o}>💬 WhatsApp</a>`:""}</div></div></div>`}).join("");
}
$("shopsec").onclick=e=>{const b=e.target.closest("[data-tg]");if(b){S.tag=S.tag==b.dataset.tg?"":b.dataset.tg;drawShops()}};

// ---- Backend API (same origin by default; set window.SOUQ_API before this script to use another host) ----
const API=(window.SOUQ_API||"").replace(/\/$/,"");
let SHOPS_DB=[];
async function api(p,o){const r=await fetch(API+p,{headers:{"Content-Type":"application/json"},...o});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||String(r.status));return j}
const normShop=x=>x&&x.id?{id:String(x.id),n:String(x.n||"").slice(0,60),ig:x.ig,web:x.web,wa:x.wa,cat:x.cat,e:String(x.e||"🛍️").slice(0,4),tags:(Array.isArray(x.tags)?x.tags:[]).filter(q=>typeof q=="string").slice(0,6).map(q=>[q.slice(0,30),q.slice(0,30)])}:null;
async function loadData(){try{const[a,s]=await Promise.all([api("/api/ads"),api("/api/shops")]);REMOTE=a.items||[];SHOPS_DB=(s.items||[]).map(normShop).filter(Boolean);drawAds()}catch(e){}}
